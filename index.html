<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>For You 💘</title>

    <link rel="stylesheet" href="./Styles/styles.css">
    <script src="./script.js" defer></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #fff0f6;
        }

        .made-with-love {
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: #777;
            font-size: 14px;
        }

        .header_text {
            margin: 10px 0;
        }

        .buttons {
            margin-top: 20px;
        }

        .btn {
            padding: 10px 25px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px;
            background-color: #ff6b81;
            color: white;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: scale(1.1);
        }

        .gif_container img {
            max-width: 300px;
            border-radius: 15px;
        }
    </style>
</head>

<body>
    <div class="container">

        <div>
            <h1 class="header_text">Hiii imtu 💘</h1>
            <h1 class="header_text">So… I have a tiny question for you 👉👈</h1>
            <h1 class="header_text">Will you be my Valentine? 💖</h1>
        </div>

        <div class="gif_container">
            <img 
                src="https://media.tenor.com/-O3TskrhZgUAAAAC/cats-kittens-kitten-cat.gif" 
                alt="Cute animated kitten">
        </div>

        <div class="buttons">
            <button class="btn" id="yesButton" onclick="nextPage()">YES 😭💘</button>
            <button class="btn" id="noButton" onmouseover="moveButton()">No 😶</button>
        </div>

        <audio id="bgMusic" loop>
            <source src="HereWithMe.mp3" type="audio/mpeg">
        </audio>

        <p class="made-with-love">
            Made with love by Aditi 💗
        </p>

    </div>
</body>
</html>
